[package]
name = "voltschematix"
version = "1.0.7"
description = "VoltSchematix - plannen van een elektrische installatie tekenen"
authors = ["VoltSchematix"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Alleen voor de automatische test in GitHub Actions: de Windows-vensters worden dan
# vervangen door een lijstje met paden. Zit NIET in het gewone programma.
e2e = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
