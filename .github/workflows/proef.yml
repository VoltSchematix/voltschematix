# Tijdelijke proef: het echte installatiebestand bouwen met vaste onderdelen, bouwbewijs en controlecode,
# zonder iets bij Releases te zetten. Wordt niet naar main gebracht.
name: Proef bouwen met bouwbewijs (tijdelijk)
on:
  push:
    branches: [tmp-lock]
permissions:
  contents: read
jobs:
  proef:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Bouwhulpmiddelen installeren
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Installatieprogramma bouwen (zoals bij een release)
        working-directory: desktop
        run: npm run tauri build -- -- --locked
      - name: Vergrendelbestanden ongewijzigd na het bouwen
        run: git status --porcelain; git diff --exit-code -- desktop/src-tauri/Cargo.lock desktop/package-lock.json
      - name: Bouwbewijs maken
        id: att
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: desktop/src-tauri/target/release/bundle/nsis/*.exe
      - name: Bouwbewijs nakijken
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $f = Get-ChildItem desktop\src-tauri\target\release\bundle\nsis -Filter *.exe | Select-Object -First 1
          "BESTAND $($f.Name) $((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()) $($f.Length)"
          "ATTEST-URL ${{ steps.att.outputs.attestation-url }}"
          gh attestation verify $f.FullName --repo $env:GITHUB_REPOSITORY
